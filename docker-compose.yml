# Development stack only. Do not use this file on the Ubuntu production host.
# Prod: docker compose -f docker-compose.prod.yml up -d --build --force-recreate
# Never pass --remove-orphans on prod (nginx/certbot serve TLS).
#
# This project is named foreverland-dev and uses *_dev container names so a
# bare `docker compose up` cannot replace prod's foreverland / foreverland_db.

name: foreverland-dev

volumes:
  db_data:
  base-data:

services:
  web:
    container_name: foreverland_dev
    build: ./web
    ports:
      - "8765:8000"
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./web/:/home/ubuntu/app
    command: bash -c "
      python manage.py collectstatic --noinput &&
      python manage.py repair_migration_history &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"
      # sleep infinity"
  db:
    container_name: foreverland_db_dev
    image: mariadb:10.6
    restart: always
    env_file:
      - ./.env
    environment:
      # App user MYSQL_PASSWORD is not enough; first init needs a root password.
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MARIADB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MARIADB_AUTO_UPGRADE: "1"
    ports:
        - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./data:/docker-entrypoint-initdb.d
    healthcheck:
      # --innodb_initialized uses a socket connection without -h localhost.
      # On Docker Desktop that authenticates as healthcheck@<container-ip>,
      # which this image does not create, so a running server looks unhealthy.
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
