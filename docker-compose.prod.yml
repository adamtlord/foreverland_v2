# Production stack (gunicorn + MySQL 8 + nginx + certbot).
# Image is ${PROD_DB_IMAGE:-mysql:8.0}. Do not set this back to mysql:5.7;
# the ./db datadir is MySQL 8. Rollback uses scripts/cutover-mysql.sh.
# Always pass -f docker-compose.prod.yml. Bare `docker compose up` starts the
# dev MariaDB stack instead and leaves nginx/certbot as orphans.
#
#   docker compose -f docker-compose.prod.yml down
#   docker compose -f docker-compose.prod.yml up -d --build --force-recreate
#
# Do not pass --remove-orphans unless you intend to delete nginx/certbot (TLS).
# .env.prod must set MYSQL_ROOT_PASSWORD (MYSQL_PASSWORD is the app user only).
# Datadir is ./db → /var/lib/mysql. If that directory is empty, MySQL will
# initialize a new data dir instead of using existing production data.

volumes:
  static_volume:
  media_volume:

services:
  web:
    container_name: foreverland
    restart: always
    build: ./web
    expose:
      - 8000
    env_file:
      - .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=foreverland.settings.prod
    depends_on:
      - db
    volumes:
      - static_volume:/home/ubuntu/app/staticfiles
      - media_volume:/home/ubuntu/app/mediafiles
    command: /home/ubuntu/app/entrypoint.sh
  db:
    container_name: foreverland_db
    image: ${PROD_DB_IMAGE:-mysql:8.0}
    restart: always
    env_file:
      - .env.prod
    expose:
      - "3306"
    volumes:
      - ./db:/var/lib/mysql
      - ./data:/docker-entrypoint-initdb.d
  nginx:
    image: nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - static_volume:/home/ubuntu/app/staticfiles
      - media_volume:/home/ubuntu/app/mediafiles
      - ./nginx:/etc/nginx/conf.d
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    depends_on:
      - web
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
